name: Codex Bot

on:
  issue_comment:
    types: [created, edited]     # コメントで起動
  issues:
    types: [opened, edited]      # (任意) 本文編集でも起動

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  run:
    # Bot自身のコメントでは動かさない
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openai

      - name: Run bot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python .github/workflows/codex_bot.py \
            --repo "${{ github.repository }}" \
            --issue "${{ github.event.issue.number }}" \
            --comment <<'EOF'
          ${{ github.event.comment.body || github.event.issue.body }}
          EOF