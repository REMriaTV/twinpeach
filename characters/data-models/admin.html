<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>データ編集モード | 狼煙屋研究資料</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Helvetica Neue', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            min-height: 100vh;
            padding: 40px 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: #ffffff;
            margin-bottom: 10px;
            font-size: 2.5rem;
            font-weight: 300;
            letter-spacing: 0.1em;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 0.95rem;
            letter-spacing: 0.05em;
        }

        .admin-notice {
            background: rgba(212, 175, 55, 0.1);
            color: #d4af37;
            padding: 15px 25px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            margin-bottom: 30px;
            text-align: center;
            font-size: 0.9rem;
            letter-spacing: 0.05em;
        }
        
        .view-link-container {
            text-align: center;
            margin-bottom: 30px;
        }

        .view-link {
            display: inline-block;
            padding: 12px 30px;
            background: transparent;
            color: #888;
            text-decoration: none;
            border: 1px solid #444;
            font-weight: 300;
            transition: all 0.3s;
            letter-spacing: 0.1em;
            font-size: 0.9rem;
        }

        .view-link:hover {
            border-color: #888;
            color: #fff;
        }

        .tab-container {
            background: #2a2a2a;
            border: 1px solid #444;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .tabs {
            display: flex;
            background: #1a1a1a;
            border-bottom: 1px solid #444;
        }

        .tab {
            flex: 1;
            padding: 18px;
            text-align: center;
            cursor: pointer;
            color: #888;
            font-weight: 300;
            transition: all 0.3s;
            border: none;
            background: none;
            font-size: 0.95rem;
            letter-spacing: 0.05em;
            position: relative;
        }

        .tab:hover {
            color: #fff;
        }

        .tab.active {
            color: #fff;
            background: #2a2a2a;
        }
        
        .tab.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            right: 0;
            height: 2px;
            background: #d4af37;
        }

        .content {
            padding: 30px;
            min-height: 600px;
        }

        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .search-box {
            display: flex;
            gap: 15px;
            flex: 1;
            min-width: 300px;
        }

        .search-input {
            flex: 1;
            padding: 12px 20px;
            border: 1px solid #444;
            font-size: 0.95rem;
            background: #1a1a1a;
            color: #fff;
        }
        
        .search-input:focus {
            outline: none;
            border-color: #d4af37;
        }

        .btn {
            padding: 12px 25px;
            border: none;
            cursor: pointer;
            font-weight: 300;
            transition: all 0.3s;
            font-size: 0.9rem;
            letter-spacing: 0.05em;
        }

        .btn-primary {
            background: transparent;
            color: #d4af37;
            border: 1px solid #d4af37;
        }

        .btn-primary:hover {
            background: #d4af37;
            color: #000;
        }

        .btn-success {
            background: transparent;
            color: #48bb78;
            border: 1px solid #48bb78;
        }

        .btn-success:hover {
            background: #48bb78;
            color: #000;
        }

        .btn-danger {
            background: transparent;
            color: #f56565;
            border: 1px solid #f56565;
        }

        .btn-danger:hover {
            background: #f56565;
            color: #000;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .data-table th {
            background: #1a1a1a;
            padding: 15px;
            text-align: left;
            font-weight: 300;
            color: #888;
            border-bottom: 1px solid #444;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.05em;
        }

        .data-table td {
            padding: 15px;
            border-bottom: 1px solid #333;
            color: #ddd;
        }

        .data-table tr:hover {
            background: rgba(212, 175, 55, 0.05);
        }

        .action-buttons {
            display: flex;
            gap: 8px;
        }

        .btn-sm {
            padding: 6px 15px;
            font-size: 0.85rem;
        }

        .form-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            overflow: auto;
        }

        .form-content {
            background: #2a2a2a;
            margin: 20px auto;
            padding: 40px;
            width: 90%;
            max-width: 800px;
            border: 1px solid #444;
            animation: slideIn 0.3s;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 10px 50px rgba(0,0,0,0.5);
        }

        @keyframes slideIn {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .form-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .form-header h2 {
            color: #fff;
            font-weight: 300;
            letter-spacing: 0.05em;
        }

        .close-modal {
            font-size: 28px;
            font-weight: 300;
            cursor: pointer;
            color: #666;
            transition: color 0.3s;
        }

        .close-modal:hover {
            color: #fff;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        .form-label {
            font-weight: 300;
            color: #888;
            margin-bottom: 8px;
            font-size: 0.9rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .form-input,
        .form-textarea,
        .form-select {
            padding: 12px 15px;
            border: 1px solid #444;
            background: #1a1a1a;
            color: #fff;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .form-input:focus,
        .form-textarea:focus,
        .form-select:focus {
            outline: none;
            border-color: #d4af37;
        }

        .form-textarea {
            min-height: 100px;
            resize: vertical;
        }
        
        .form-select {
            cursor: pointer;
        }
        
        .form-select option {
            background: #1a1a1a;
            color: #fff;
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 15px;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #444;
        }

        .tag-input-container {
            position: relative;
        }

        .tag-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .tag {
            display: inline-flex;
            align-items: center;
            padding: 6px 15px;
            background: transparent;
            border: 1px solid #555;
            font-size: 0.85rem;
            color: #ccc;
            transition: all 0.3s;
        }
        
        .tag:hover {
            border-color: #d4af37;
            color: #d4af37;
        }

        .tag-remove {
            margin-left: 8px;
            cursor: pointer;
            color: #666;
            transition: color 0.3s;
        }

        .tag-remove:hover {
            color: #f56565;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: #888;
        }

        .error {
            background: rgba(248, 215, 218, 0.1);
            color: #f56565;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(245, 101, 101, 0.3);
        }

        .success {
            background: rgba(198, 246, 213, 0.1);
            color: #48bb78;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(72, 187, 120, 0.3);
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8rem;
            }
            
            .action-bar {
                flex-direction: column;
                align-items: stretch;
            }
            
            .search-box {
                min-width: auto;
            }
            
            .data-table {
                font-size: 0.85rem;
            }
            
            .form-content {
                padding: 25px;
            }
        }

        .connection-status {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 12px 25px;
            font-size: 0.85rem;
            font-weight: 300;
            z-index: 999;
            letter-spacing: 0.05em;
            border: 1px solid;
        }

        .status-connected {
            background: rgba(72, 187, 120, 0.1);
            color: #48bb78;
            border-color: rgba(72, 187, 120, 0.3);
        }

        .status-disconnected {
            background: rgba(245, 101, 101, 0.1);
            color: #f56565;
            border-color: rgba(245, 101, 101, 0.3);
        }

        .status-local {
            background: rgba(237, 137, 54, 0.1);
            color: #ed8936;
            border-color: rgba(237, 137, 54, 0.3);
        }
        
        /* スクロールバーのスタイリング */
        ::-webkit-scrollbar {
            width: 10px;
        }
        
        ::-webkit-scrollbar-track {
            background: #1a1a1a;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #555;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #666;
        }
        
        /* フォームのスクロールバー */
        .form-content::-webkit-scrollbar {
            width: 8px;
        }
        
        .form-content::-webkit-scrollbar-track {
            background: #2a2a2a;
        }
        
        .form-content::-webkit-scrollbar-thumb {
            background: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>データ編集モード</h1>
        <p class="subtitle">狼煙屋研究資料庫</p>
        
        <div class="admin-notice">
            ⚠️ 管理者専用 - データの編集は慎重に行ってください
        </div>
        
        <div class="view-link-container">
            <a href="index.html" class="view-link">← 閲覧モードに戻る</a>
        </div>
        
        <div class="tab-container">
            <div class="tabs">
                <button class="tab active" onclick="showTab('birds')">鳥類データベース</button>
                <button class="tab" onclick="showTab('stones')">鉱物データベース</button>
            </div>
            
            <div class="content">
                <!-- 鳥データベースタブ -->
                <div id="birds-tab" class="tab-content">
                    <div class="action-bar">
                        <div class="search-box">
                            <input type="text" class="search-input" id="bird-search" placeholder="鳥の名前で検索...">
                            <button class="btn btn-primary" onclick="searchBirds()">検索</button>
                        </div>
                        <button class="btn btn-success" onclick="showBirdForm()">＋ 新規追加</button>
                    </div>
                    <div id="birds-list">
                        <div class="loading">データを読み込み中...</div>
                    </div>
                </div>
                
                <!-- 火打石データベースタブ -->
                <div id="stones-tab" class="tab-content" style="display: none;">
                    <div class="action-bar">
                        <div class="search-box">
                            <input type="text" class="search-input" id="stone-search" placeholder="石の名前や特徴で検索...">
                            <button class="btn btn-primary" onclick="searchStones()">検索</button>
                        </div>
                        <button class="btn btn-success" onclick="showStoneForm()">＋ 新規追加</button>
                    </div>
                    <div id="stones-list">
                        <div class="loading">データを読み込み中...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 鳥編集フォーム -->
    <div id="bird-form-modal" class="form-modal">
        <div class="form-content">
            <div class="form-header">
                <h2 id="bird-form-title">新しい鳥を追加</h2>
                <span class="close-modal" onclick="closeBirdForm()">&times;</span>
            </div>
            <form id="bird-form" onsubmit="saveBird(event)">
                <div class="form-grid">
                    <div class="form-group">
                        <label class="form-label">ID *</label>
                        <input type="text" class="form-input" name="id" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">名前 *</label>
                        <input type="text" class="form-input" name="name" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">学名</label>
                        <input type="text" class="form-input" name="scientific_name">
                    </div>
                    <div class="form-group">
                        <label class="form-label">科</label>
                        <input type="text" class="form-input" name="family">
                    </div>
                    <div class="form-group">
                        <label class="form-label">サイズ</label>
                        <select class="form-select" name="size">
                            <option value="">選択してください</option>
                            <option value="小型">小型</option>
                            <option value="中型">中型</option>
                            <option value="大型">大型</option>
                            <option value="中型〜大型">中型〜大型</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">生息地</label>
                        <input type="text" class="form-input" name="habitat">
                    </div>
                    
                    <div class="form-group full-width">
                        <label class="form-label">外見</label>
                        <textarea class="form-textarea" name="appearance"></textarea>
                    </div>
                    <div class="form-group">
                        <label class="form-label">鳴き声</label>
                        <input type="text" class="form-input" name="voice">
                    </div>
                    <div class="form-group">
                        <label class="form-label">行動</label>
                        <input type="text" class="form-input" name="behavior">
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">活動時間</label>
                        <select class="form-select" name="activity">
                            <option value="">選択してください</option>
                            <option value="昼行性">昼行性</option>
                            <option value="夜行性">夜行性</option>
                            <option value="薄明薄暮性">薄明薄暮性</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">食性</label>
                        <input type="text" class="form-input" name="diet">
                    </div>
                    <div class="form-group">
                        <label class="form-label">社会性</label>
                        <input type="text" class="form-input" name="social_behavior">
                    </div>
                    <div class="form-group">
                        <label class="form-label">営巣習慣</label>
                        <input type="text" class="form-input" name="nesting_habits">
                    </div>
                    
                    <div class="form-group full-width">
                        <label class="form-label">性格（一般）</label>
                        <textarea class="form-textarea" name="personality_general"></textarea>
                    </div>
                    <div class="form-group full-width">
                        <label class="form-label">人との関わり</label>
                        <textarea class="form-textarea" name="human_interaction"></textarea>
                    </div>
                    <div class="form-group full-width">
                        <label class="form-label">知能</label>
                        <textarea class="form-textarea" name="intelligence"></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">春の行動</label>
                        <input type="text" class="form-input" name="seasonal_spring">
                    </div>
                    <div class="form-group">
                        <label class="form-label">夏の行動</label>
                        <input type="text" class="form-input" name="seasonal_summer">
                    </div>
                    <div class="form-group">
                        <label class="form-label">秋の行動</label>
                        <input type="text" class="form-input" name="seasonal_autumn">
                    </div>
                    <div class="form-group">
                        <label class="form-label">冬の行動</label>
                        <input type="text" class="form-input" name="seasonal_winter">
                    </div>
                    
                    <div class="form-group full-width">
                        <label class="form-label">文化的象徴</label>
                        <input type="text" class="form-input" name="symbolism_cultural">
                    </div>
                    <div class="form-group full-width">
                        <label class="form-label">精神的象徴</label>
                        <input type="text" class="form-input" name="symbolism_spiritual">
                    </div>
                    
                    <div class="form-group full-width">
                        <label class="form-label">適合する狼煙屋タイプ（Enterで追加）</label>
                        <input type="text" class="form-input" id="bird-suitable-types" onkeypress="addBirdTag(event)">
                        <div class="tag-list" id="bird-suitable-types-tags"></div>
                    </div>
                    <div class="form-group full-width">
                        <label class="form-label">煙のスタイル</label>
                        <input type="text" class="form-input" name="noroshiya_smoking_style">
                    </div>
                    <div class="form-group full-width">
                        <label class="form-label">コミュニケーションスタイル</label>
                        <input type="text" class="form-input" name="noroshiya_communication_style">
                    </div>
                </div>
                
                <div class="form-actions">
                    <button type="button" class="btn btn-danger" onclick="closeBirdForm()">キャンセル</button>
                    <button type="submit" class="btn btn-success">保存</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 石編集フォーム -->
    <div id="stone-form-modal" class="form-modal">
        <div class="form-content">
            <div class="form-header">
                <h2 id="stone-form-title">新しい石を追加</h2>
                <span class="close-modal" onclick="closeStoneForm()">&times;</span>
            </div>
            <form id="stone-form" onsubmit="saveStone(event)">
                <div class="form-grid">
                    <div class="form-group">
                        <label class="form-label">ID *</label>
                        <input type="text" class="form-input" name="id" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">名前 *</label>
                        <input type="text" class="form-input" name="name" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">タイプ</label>
                        <input type="text" class="form-input" name="type" value="火打石">
                    </div>
                    <div class="form-group">
                        <label class="form-label">サイズ</label>
                        <select class="form-select" name="size">
                            <option value="">選択してください</option>
                            <option value="小さめ">小さめ</option>
                            <option value="中くらい">中くらい</option>
                            <option value="大きめ">大きめ</option>
                            <option value="様々">様々</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">形状</label>
                        <input type="text" class="form-input" name="shape">
                    </div>
                    <div class="form-group">
                        <label class="form-label">質感</label>
                        <input type="text" class="form-input" name="texture">
                    </div>
                    <div class="form-group">
                        <label class="form-label">産地</label>
                        <input type="text" class="form-input" name="origin">
                    </div>
                    <div class="form-group">
                        <label class="form-label">レアリティ</label>
                        <select class="form-select" name="rarity">
                            <option value="">選択してください</option>
                            <option value="common">Common</option>
                            <option value="uncommon">Uncommon</option>
                            <option value="rare">Rare</option>
                            <option value="very_rare">Very Rare</option>
                        </select>
                    </div>
                    
                    <div class="form-group full-width">
                        <label class="form-label">色（Enterで追加）</label>
                        <input type="text" class="form-input" id="stone-colors" onkeypress="addStoneColor(event)">
                        <div class="tag-list" id="stone-colors-tags"></div>
                    </div>
                    
                    <div class="form-group full-width">
                        <label class="form-label">外観</label>
                        <textarea class="form-textarea" name="appearance"></textarea>
                    </div>
                    <div class="form-group">
                        <label class="form-label">重さ</label>
                        <input type="text" class="form-input" name="weight">
                    </div>
                    <div class="form-group">
                        <label class="form-label">硬さ</label>
                        <input type="text" class="form-input" name="hardness">
                    </div>
                    <div class="form-group full-width">
                        <label class="form-label">特殊な特徴</label>
                        <textarea class="form-textarea" name="special_features"></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">元素</label>
                        <input type="text" class="form-input" name="elemental_element">
                    </div>
                    <div class="form-group">
                        <label class="form-label">エネルギー</label>
                        <input type="text" class="form-input" name="elemental_energy">
                    </div>
                    <div class="form-group">
                        <label class="form-label">共鳴</label>
                        <input type="text" class="form-input" name="elemental_resonance">
                    </div>
                    
                    <div class="form-group full-width">
                        <label class="form-label">発見場所（Enterで追加）</label>
                        <input type="text" class="form-input" id="stone-locations" onkeypress="addStoneLocation(event)">
                        <div class="tag-list" id="stone-locations-tags"></div>
                    </div>
                    
                    <div class="form-group full-width">
                        <label class="form-label">マッチングキーワード（Enterで追加）</label>
                        <input type="text" class="form-input" id="stone-keywords" onkeypress="addStoneKeyword(event)">
                        <div class="tag-list" id="stone-keywords-tags"></div>
                    </div>
                    
                    <div class="form-group full-width">
                        <label class="form-label">相性の良い狼煙屋</label>
                        <input type="text" class="form-input" name="noroshiya_primary_match">
                    </div>
                    <div class="form-group full-width">
                        <label class="form-label">相性の理由</label>
                        <textarea class="form-textarea" name="noroshiya_match_reason"></textarea>
                    </div>
