<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鳥・石マスターデータ管理</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
            font-size: 2rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .tab-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .tabs {
            display: flex;
            background: #3498db;
        }

        .tab {
            flex: 1;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            color: white;
            font-weight: bold;
            transition: all 0.3s;
            border: none;
            background: none;
            font-size: 1rem;
        }

        .tab:hover {
            background: rgba(255,255,255,0.1);
        }

        .tab.active {
            background: white;
            color: #3498db;
        }

        .content {
            padding: 20px;
            min-height: 500px;
        }

        .data-grid {
            display: grid;
            gap: 20px;
        }

        .data-card {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            border: 1px solid #e9ecef;
            transition: all 0.3s;
            cursor: pointer;
        }

        .data-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .bird-card h3, .stone-card h3 {
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .bird-info, .stone-info {
            display: grid;
            gap: 10px;
            font-size: 0.9rem;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 1px solid #dee2e6;
        }

        .info-label {
            font-weight: bold;
            color: #495057;
        }

        .info-value {
            color: #6c757d;
        }

        .characteristics {
            margin-top: 10px;
            padding: 10px;
            background: white;
            border-radius: 5px;
        }

        .search-box {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }

        .search-input {
            flex: 1;
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1rem;
        }

        .search-button {
            padding: 10px 20px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .search-button:hover {
            background: #2980b9;
        }

        .detail-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            overflow: auto;
        }

        .modal-content {
            background: white;
            margin: 50px auto;
            padding: 30px;
            width: 90%;
            max-width: 600px;
            border-radius: 15px;
            animation: slideIn 0.3s;
        }

        @keyframes slideIn {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .close-modal {
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            color: #aaa;
        }

        .close-modal:hover {
            color: #000;
        }

        .detail-section {
            margin: 20px 0;
        }

        .detail-section h3 {
            color: #2c3e50;
            margin-bottom: 10px;
            border-bottom: 2px solid #3498db;
            padding-bottom: 5px;
        }

        .tag {
            display: inline-block;
            padding: 3px 10px;
            margin: 2px;
            background: #e9ecef;
            border-radius: 15px;
            font-size: 0.85rem;
        }

        .color-tag {
            border: 1px solid #ccc;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.5rem;
            }
            
            .tab {
                font-size: 0.9rem;
                padding: 12px 5px;
            }
            
            .content {
                padding: 15px;
            }
            
            .modal-content {
                margin: 20px auto;
                padding: 20px;
            }
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: #6c757d;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .admin-link {
            display: inline-block;
            padding: 10px 20px;
            background: #f56565;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: all 0.3s;
        }

        .admin-link:hover {
            background: #e53e3e;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐦 鳥・💎 石マスターデータ管理</h1>
        
        <div style="text-align: center; margin-bottom: 20px;">
            <a href="admin.html" class="admin-link">✏️ データを編集する（管理者用）</a>
        </div>
        
        <div class="tab-container">
            <div class="tabs">
                <button class="tab active" onclick="showTab('birds')">🐦 鳥データベース</button>
                <button class="tab" onclick="showTab('stones')">💎 火打石データベース</button>
            </div>
            
            <div class="content">
                <!-- 鳥データベースタブ -->
                <div id="birds-tab" class="tab-content">
                    <div class="search-box">
                        <input type="text" class="search-input" id="bird-search" placeholder="鳥の名前で検索...">
                        <button class="search-button" onclick="searchBirds()">検索</button>
                    </div>
                    <div id="birds-grid" class="data-grid">
                        <div class="loading">データを読み込み中...</div>
                    </div>
                </div>
                
                <!-- 火打石データベースタブ -->
                <div id="stones-tab" class="tab-content" style="display: none;">
                    <div class="search-box">
                        <input type="text" class="search-input" id="stone-search" placeholder="石の名前や特徴で検索...">
                        <button class="search-button" onclick="searchStones()">検索</button>
                    </div>
                    <div id="stones-grid" class="data-grid">
                        <div class="loading">データを読み込み中...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 詳細モーダル -->
    <div id="detail-modal" class="detail-modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <div id="modal-body"></div>
        </div>
    </div>

    <script src="birds-database.js"></script>
    <script src="stones-database.js"></script>
    <script src="data-manager.js"></script>
</body>
</html>
