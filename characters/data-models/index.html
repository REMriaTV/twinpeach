<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鳥・石マスターデータベース | 狼煙屋研究資料</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Helvetica Neue', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            min-height: 100vh;
            padding: 40px 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: #ffffff;
            margin-bottom: 10px;
            font-size: 2.5rem;
            font-weight: 300;
            letter-spacing: 0.1em;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 40px;
            font-size: 0.95rem;
            letter-spacing: 0.05em;
        }
        
        .header-line {
            width: 100px;
            height: 1px;
            background: linear-gradient(90deg, transparent, #d4af37, transparent);
            margin: 0 auto 40px;
        }
        
        .admin-link-container {
            text-align: center;
            margin-bottom: 40px;
        }

        .admin-link {
            display: inline-block;
            padding: 12px 30px;
            background: transparent;
            color: #d4af37;
            text-decoration: none;
            border: 1px solid #d4af37;
            font-weight: 300;
            transition: all 0.3s;
            letter-spacing: 0.1em;
            font-size: 0.9rem;
        }

        .admin-link:hover {
            background: #d4af37;
            color: #000;
        }

        .tab-container {
            background: #2a2a2a;
            border: 1px solid #444;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .tabs {
            display: flex;
            background: #1a1a1a;
            border-bottom: 1px solid #444;
        }

        .tab {
            flex: 1;
            padding: 18px;
            text-align: center;
            cursor: pointer;
            color: #888;
            font-weight: 300;
            transition: all 0.3s;
            border: none;
            background: none;
            font-size: 0.95rem;
            letter-spacing: 0.05em;
            position: relative;
        }

        .tab:hover {
            color: #fff;
        }

        .tab.active {
            color: #fff;
            background: #2a2a2a;
        }
        
        .tab.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            right: 0;
            height: 2px;
            background: #d4af37;
        }

        .content {
            padding: 30px;
            min-height: 500px;
        }

        .data-grid {
            display: grid;
            gap: 20px;
        }

        .data-card {
            background: #2a2a2a;
            padding: 25px;
            border: 1px solid #444;
            transition: all 0.3s;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        
        .data-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, transparent, rgba(212, 175, 55, 0.05));
            opacity: 0;
            transition: opacity 0.3s;
        }

        .data-card:hover {
            transform: translateY(-2px);
            border-color: #d4af37;
        }
        
        .data-card:hover::before {
            opacity: 1;
        }

        .bird-card h3, .stone-card h3 {
            color: #fff;
            margin-bottom: 15px;
            font-weight: 300;
            font-size: 1.3rem;
            letter-spacing: 0.03em;
        }

        .bird-info, .stone-info {
            display: grid;
            gap: 10px;
            font-size: 0.9rem;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #333;
        }

        .info-label {
            font-weight: 400;
            color: #888;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .info-value {
            color: #ccc;
            text-align: right;
        }

        .characteristics {
            margin-top: 15px;
            padding: 15px;
            background: #1a1a1a;
            border-left: 2px solid #d4af37;
            font-size: 0.9rem;
            color: #bbb;
        }

        .search-box {
            margin-bottom: 30px;
            display: flex;
            gap: 15px;
        }

        .search-input {
            flex: 1;
            padding: 12px 20px;
            border: 1px solid #444;
            font-size: 0.95rem;
            background: #1a1a1a;
            color: #fff;
        }
        
        .search-input:focus {
            outline: none;
            border-color: #d4af37;
        }

        .search-button {
            padding: 12px 30px;
            background: transparent;
            color: #d4af37;
            border: 1px solid #d4af37;
            cursor: pointer;
            font-weight: 300;
            transition: all 0.3s;
            letter-spacing: 0.05em;
        }

        .search-button:hover {
            background: #d4af37;
            color: #000;
        }

        .detail-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            overflow: auto;
        }

        .modal-content {
            background: #2a2a2a;
            margin: 50px auto;
            padding: 40px;
            width: 90%;
            max-width: 700px;
            border: 1px solid #444;
            animation: slideIn 0.3s;
            box-shadow: 0 10px 50px rgba(0,0,0,0.5);
        }

        @keyframes slideIn {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-content h2 {
            color: #fff;
            font-weight: 300;
            margin-bottom: 10px;
            font-size: 2rem;
        }
        
        .modal-content > p {
            color: #666;
            margin-bottom: 30px;
            font-style: italic;
        }

        .close-modal {
            float: right;
            font-size: 28px;
            font-weight: 300;
            cursor: pointer;
            color: #666;
            transition: color 0.3s;
        }

        .close-modal:hover {
            color: #fff;
        }

        .detail-section {
            margin: 30px 0;
        }

        .detail-section h3 {
            color: #fff;
            margin-bottom: 15px;
            border-bottom: 1px solid #444;
            padding-bottom: 10px;
            font-weight: 300;
            letter-spacing: 0.05em;
        }
        
        .detail-section p {
            color: #ccc;
            line-height: 1.8;
            margin-bottom: 10px;
        }
        
        .detail-section strong {
            color: #d4af37;
            font-weight: 400;
        }

        .tag {
            display: inline-block;
            padding: 5px 15px;
            margin: 3px;
            background: transparent;
            border: 1px solid #555;
            font-size: 0.85rem;
            color: #ccc;
            transition: all 0.3s;
        }
        
        .tag:hover {
            border-color: #d4af37;
            color: #d4af37;
        }

        .color-tag {
            border: 1px solid #666;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8rem;
            }
            
            .tab {
                font-size: 0.85rem;
                padding: 15px 5px;
            }
            
            .content {
                padding: 20px;
            }
            
            .modal-content {
                margin: 20px auto;
                padding: 25px;
            }
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: #888;
        }

        .error {
            background: rgba(248, 215, 218, 0.1);
            color: #f56565;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(245, 101, 101, 0.3);
        }
        
        /* スクロールバーのスタイリング */
        ::-webkit-scrollbar {
            width: 10px;
        }
        
        ::-webkit-scrollbar-track {
            background: #1a1a1a;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #555;
            border-radius: 0;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>狼煙屋研究資料庫</h1>
        <p class="subtitle">鳥類・鉱物データベース</p>
        <div class="header-line"></div>
        
        <div class="admin-link-container">
            <a href="admin.html" class="admin-link">✏️ データ編集モード</a>
        </div>
        
        <div class="tab-container">
            <div class="tabs">
                <button class="tab active" onclick="showTab('birds')">鳥類データベース</button>
                <button class="tab" onclick="showTab('stones')">鉱物データベース</button>
            </div>
            
            <div class="content">
                <!-- 鳥データベースタブ -->
                <div id="birds-tab" class="tab-content">
                    <div class="search-box">
                        <input type="text" class="search-input" id="bird-search" placeholder="鳥の名前で検索...">
                        <button class="search-button" onclick="searchBirds()">検索</button>
                    </div>
                    <div id="birds-grid" class="data-grid">
                        <div class="loading">データを読み込み中...</div>
                    </div>
                </div>
                
                <!-- 火打石データベースタブ -->
                <div id="stones-tab" class="tab-content" style="display: none;">
                    <div class="search-box">
                        <input type="text" class="search-input" id="stone-search" placeholder="石の名前や特徴で検索...">
                        <button class="search-button" onclick="searchStones()">検索</button>
                    </div>
                    <div id="stones-grid" class="data-grid">
                        <div class="loading">データを読み込み中...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 詳細モーダル -->
    <div id="detail-modal" class="detail-modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <div id="modal-body"></div>
        </div>
    </div>

    <script src="birds-database.js"></script>
    <script src="stones-database.js"></script>
    <script src="data-manager.js"></script>
</body>
</html>
