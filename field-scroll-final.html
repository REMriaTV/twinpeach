<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>野呂子無料相談所 - Smoke Network Service</title>
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(180deg, #0a0a0a 0%, #1a1a2e 30%, #16213e 60%, #0f0f23 100%);
            color: #fff;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            min-height: 100vh;
        }
        
        .container {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }
        
        /* 時間帯による背景グラデーション */
        .sky-gradient {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 70%;
            transition: all 3s ease;
        }
        
        /* 星空のエフェクト */
        .stars-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
        }
        
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s ease-in-out infinite;
        }
        
        .star.small {
            width: 1px;
            height: 1px;
            animation-duration: 3s;
        }
        
        .star.medium {
            width: 2px;
            height: 2px;
            animation-duration: 4s;
        }
        
        .star.large {
            width: 3px;
            height: 3px;
            animation-duration: 5s;
            box-shadow: 0 0 2px rgba(255, 255, 255, 0.8);
        }
        
        @keyframes twinkle {
            0%, 100% { 
                opacity: 0.3;
                transform: scale(1);
            }
            50% { 
                opacity: 1;
                transform: scale(1.2);
            }
        }
        
        /* 流れ星 */
        .shooting-star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            opacity: 0;
            animation: shoot 3s linear infinite;
        }
        
        .shooting-star::after {
            content: '';
            position: absolute;
            top: 0;
            right: 2px;
            width: 100px;
            height: 2px;
            background: linear-gradient(to right, white, transparent);
            transform-origin: right center;
        }
        
        @keyframes shoot {
            0% {
                opacity: 0;
                transform: translateX(0) translateY(0);
            }
            5% {
                opacity: 1;
            }
            95% {
                opacity: 1;
            }
            100% {
                opacity: 0;
                transform: translateX(-500px) translateY(300px);
            }
        }
        
        /* 月のエフェクト */
        .moon {
            position: absolute;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #f9f9f9 0%, #e6e6e6 50%, #cccccc 100%);
            box-shadow: 
                0 0 30px rgba(255, 255, 255, 0.5),
                0 0 60px rgba(255, 255, 255, 0.3),
                0 0 90px rgba(255, 255, 255, 0.1),
                inset -10px -10px 20px rgba(0, 0, 0, 0.1);
            right: 10%;
            top: 10%;
            z-index: 2;
            display: none;
        }
        
        /* 月のクレーター */
        .moon::before {
            content: '';
            position: absolute;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: rgba(200, 200, 200, 0.3);
            top: 25%;
            left: 30%;
            box-shadow: 
                20px 10px 0 5px rgba(180, 180, 180, 0.2),
                -10px 20px 0 3px rgba(190, 190, 190, 0.25);
        }
        
        /* 月の光輪 */
        .moon-glow {
            position: absolute;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, transparent 70%);
            top: -20px;
            left: -20px;
            animation: moonGlow 4s ease-in-out infinite alternate;
        }
        
        @keyframes moonGlow {
            0% {
                transform: scale(1);
                opacity: 0.5;
            }
            100% {
                transform: scale(1.1);
                opacity: 0.8;
            }
        }
        
        .sky-gradient.dawn {
            background: linear-gradient(to bottom, 
                #1a237e 0%, 
                #3949ab 20%, 
                #5c6bc0 40%, 
                #ff6f00 80%, 
                #ff8f00 100%);
        }
        
        .sky-gradient.day {
            background: linear-gradient(to bottom, 
                #6BB6FF 0%, 
                #87CEEB 20%, 
                #ADD8E6 50%, 
                #E6F3FF 80%,
                #F0F8FF 100%);
        }
        
        .sky-gradient.dusk {
            background: linear-gradient(to bottom, 
                #1a237e 0%, 
                #4a148c 30%, 
                #880e4f 60%, 
                #ff6f00 90%, 
                #ff8f00 100%);
        }
        
        /* 山のレイヤー */
        .mountain-layer {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 300%;
            height: 100%;
            will-change: transform;
        }
        
        .mountain-bg {
            fill: #1a1a1a;
            opacity: 0.3;
        }
        
        .mountain-mid {
            fill: #2a2a2a;
            opacity: 0.6;
        }
        
        .mountain-fg {
            fill: #0a0a0a;
        }
        
        /* スクロール可能なコンテンツ */
        .scroll-container {
            position: absolute;
            bottom: 100px;
            left: 0;
            width: 100%;
            height: 300px;
            overflow-x: auto;
            overflow-y: hidden;
            -webkit-overflow-scrolling: touch;
            z-index: 5;
        }
        
        .scroll-content {
            display: flex;
            gap: 100px;
            padding: 0 50%;
            height: 100%;
            align-items: flex-end;
            width: max-content;
        }
        
        /* 場所カード */
        .place-card {
            flex-shrink: 0;
            width: 200px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            backdrop-filter: blur(10px);
            margin-bottom: 20px;
        }
        
        .place-card:hover {
            transform: translateY(-10px);
            background: rgba(0, 0, 0, 0.8);
            border-color: rgba(255, 107, 107, 0.5);
            box-shadow: 0 10px 30px rgba(255, 107, 107, 0.3);
        }
        
        /* 煙の発生源 */
        .smoke-source {
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 20px;
            pointer-events: none;
            z-index: 10;
            margin-bottom: 10px;
        }
        
        /* 煙源の視覚的表現（炭や灰のような見た目） */
        .smoke-base {
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, 
                rgba(60, 60, 60, 0.8) 0%, 
                rgba(40, 40, 40, 0.6) 40%, 
                rgba(30, 30, 30, 0.4) 70%, 
                transparent 100%);
            border-radius: 50%;
            position: relative;
            overflow: hidden;
        }
        
        /* くすぶる効果 */
        .smoke-base::after {
            content: '';
            position: absolute;
            top: 30%;
            left: 20%;
            width: 60%;
            height: 40%;
            background: radial-gradient(ellipse at center, 
                rgba(255, 100, 0, 0.3) 0%, 
                rgba(255, 50, 0, 0.1) 50%, 
                transparent 100%);
            border-radius: 50%;
            animation: glow 3s ease-in-out infinite;
        }
        
        @keyframes glow {
            0%, 100% {
                opacity: 0.3;
                transform: scale(0.9);
            }
            50% {
                opacity: 0.6;
                transform: scale(1.1);
            }
        }
        
        /* 煙のキャンバス */
        #smokeCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        /* ヘッダー部分 */
        .header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 20px;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.3) 0%, transparent 100%);
            z-index: 10;
        }
        
        h1 {
            text-align: center;
            color: #ff6b6b;
            font-size: 2.5em;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(255, 107, 107, 0.5);
        }
        
        .noroshiya-message {
            text-align: center;
            font-size: 1.2em;
            color: #4ecdc4;
            margin: 20px 0;
            line-height: 2;
        }
        
        .back-link {
            color: #ff6b6b;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s ease;
        }
        
        .back-link:hover {
            color: #ff5252;
        }
        
        /* スクロールインジケーター */
        .scroll-indicator {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.5);
            font-size: 12px;
            animation: bounce 2s infinite;
            z-index: 10;
        }
        
        @keyframes bounce {
            0%, 100% {
                transform: translateX(-50%) translateY(0);
            }
            50% {
                transform: translateX(-50%) translateY(-10px);
            }
        }
        
        /* 風のエフェクト用 */
        .wind-effect {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
    </style>
</head>

    <script>
        // 煙のキャンバス設定
        const canvas = document.getElementById('smokeCanvas');
        const ctx = canvas.getContext('2d');
        
        // 高解像度対応
        function resizeCanvas() {
            const dpr = window.devicePixelRatio || 1;
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            canvas.style.width = window.innerWidth + 'px';
            canvas.style.height = window.innerHeight + 'px';
            ctx.scale(dpr, dpr);
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        
        // 風の強さと方向
        let windTime = 0;
        
        // 煙を生成する場所を追跡
        const smokeSources = [];
        
        // 山のあちこちに煙源を配置
        function setupRandomSmokeSources() {
            smokeSources.length = 0;
            const numSources = 8 + Math.floor(Math.random() * 5); // 8〜12個の煙源
            
            for (let i = 0; i < numSources; i++) {
                smokeSources.push({
                    x: Math.random() * window.innerWidth, // 画面全体のランダムな位置
                    y: window.innerHeight * (0.4 + Math.random() * 0.3), // 山の高さあたり
                    intensity: Math.random() * 0.8 + 0.2, // 煙の濃さもランダム
                    scale: Math.random() * 0.6 + 0.4, // 煙のスケールもランダム
                    phase: Math.random() * Math.PI * 2, // 揺れの位相
                    width: 1 + Math.random() * 2, // 煙の幅（1-3）
                    height: 200 + Math.random() * 200 // 煙の高さ（200-400）
                });
            }
        }
        
        // 煙源の位置を更新（スクロール時は再配置しない）
        function updateSmokeSources() {
            // スクロール時は何もしない（煙源は固定）
        }
        
        // パララックススクロール
        const scrollContainer = document.getElementById('scrollContainer');
        const mountainLayers = document.querySelectorAll('.mountain-layer');
        
        scrollContainer.addEventListener('scroll', () => {
            const scrollX = scrollContainer.scrollLeft;
            
            mountainLayers.forEach(layer => {
                const speed = parseFloat(layer.dataset.speed);
                layer.style.transform = `translateX(${-scrollX * speed}px)`;
            });
            
            updateSmokeSources();
        });
        
        // 時間帯の変化（リアルタイムに対応）
        const skyGradient = document.getElementById('skyGradient');
        
        function updateTimeOfDay() {
            const hour = new Date().getHours();
            let timePhase;
            
            if (hour >= 5 && hour < 8) {
                timePhase = 'dawn';  // 朝焼け
            } else if (hour >= 8 && hour < 17) {
                timePhase = 'day';   // 昼
            } else {
                timePhase = 'dusk';  // 夕焼け・夜
            }
            
            skyGradient.className = 'sky-gradient ' + timePhase;
        }
        
        // 初回実行と1分ごとに更新
        updateTimeOfDay();
        setInterval(updateTimeOfDay, 60000);
        
        // 煙をパスで描画
        function drawSmokeColumn(source, time) {
            ctx.save();
            ctx.translate(source.x, source.y);
            
            // 煙の柱を曲線で描画
            ctx.beginPath();
            
            const segments = 40;
            const points = [];
            
            // 左側の輪郭を計算
            for (let j = 0; j <= segments; j++) {
                const progress = j / segments;
                const y = -progress * source.height * source.scale;
                
                // ゆっくりとした風の揺れ（遠くから見た煙は動きが遅い）
                const windOffset = Math.sin(time * 0.0003 + progress * 2 + source.phase) * 
                                 (10 + progress * 15) * source.scale;
                const x = windOffset;
                
                // 幅（上に行くほどわずかに広がる）
                const width = source.width + progress * source.width * 0.5;
                
                points.push({ x: x - width, y: y });
            }
            
            // 左側を描く
            ctx.moveTo(points[0].x, points[0].y);
            for (let i = 1; i < points.length; i++) {
                const prev = points[i - 1];
                const curr = points[i];
                const cpx = prev.x;
                const cpy = (prev.y + curr.y) / 2;
                ctx.quadraticCurveTo(cpx, cpy, curr.x, curr.y);
            }
            
            // 右側を描く
            for (let j = segments; j >= 0; j--) {
                const progress = j / segments;
                const y = -progress * source.height * source.scale;
                const windOffset = Math.sin(time * 0.0003 + progress * 2 + source.phase) * 
                                 (10 + progress * 15) * source.scale;
                const x = windOffset;
                const width = source.width + progress * source.width * 0.5;
                
                if (j === segments) {
                    ctx.lineTo(x + width, y);
                } else {
                    const next = points[j + 1];
                    const cpx = x + width;
                    const cpy = (y + next.y) / 2;
                    ctx.quadraticCurveTo(cpx, cpy, x + width, y);
                }
            }
            
            ctx.closePath();
            
            // グラデーション（煙の濃淡）
            const gradient = ctx.createLinearGradient(0, 0, 0, -source.height * source.scale);
            gradient.addColorStop(0, `rgba(255, 255, 255, ${source.intensity * 0.9})`);
            gradient.addColorStop(0.3, `rgba(255, 255, 255, ${source.intensity * 0.7})`);
            gradient.addColorStop(0.6, `rgba(255, 255, 255, ${source.intensity * 0.4})`);
            gradient.addColorStop(1, `rgba(255, 255, 255, ${source.intensity * 0.1})`);
            
            ctx.fillStyle = gradient;
            ctx.fill();
            
            // ぼかし効果のために薄い層を重ねる
            ctx.globalAlpha = 0.3;
            ctx.filter = 'blur(2px)';
            ctx.fill();
            
            ctx.restore();
        }
        
        // アニメーションループ
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 風の時間を更新（ゆっくり）
            windTime += 16; // ミリ秒単位
            
            // 各煙源の煙を描画
            smokeSources.forEach(source => {
                drawSmokeColumn(source, windTime);
            });
            
            requestAnimationFrame(animate);
        }
        
        // クリックイベント
        document.querySelectorAll('.place-card').forEach(card => {
            card.addEventListener('click', () => {
                const place = card.dataset.place;
                window.location.href = `threads.html?place=${place}`;
            });
        });
        
        // タイピングアニメーション
        const message = 'ヤマカゼニノッテケムリガナガレル\nトオクノトモダチニオモイトドクヨ\nミンナノノロシツナガッテル...';
        const typingElement = document.getElementById('typingText');
        let charIndex = 0;
        
        function typeWriter() {
            if (charIndex < message.length) {
                if (message[charIndex] === '\n') {
                    typingElement.innerHTML += '<br>';
                } else {
                    typingElement.innerHTML += message[charIndex];
                }
                charIndex++;
                const speed = Math.random() * 20 + 30;
                setTimeout(typeWriter, speed);
            }
        }
        
        // 開始
        window.addEventListener('load', () => {
            setTimeout(typeWriter, 500);
            // 初期化時に煙源を設定
            setTimeout(() => {
                setupRandomSmokeSources(); // ランダムな煙源を設定
                animate();
            }, 100);
        });
    </script>

<script>
function updateSkyColor() {
    const now = new Date();
    const hours = now.getHours();
    const body = document.body;
    
    if (hours >= 0 && hours < 4) {
        // 深夜：漆黒の夜空
        body.style.background = "linear-gradient(180deg, #000000 0%, #0a0a0a 20%, #0f0f1a 50%, #1a1a2a 80%, #0a0a15 100%)";
    } else if (hours >= 4 && hours < 6) {
        // 未明：わずかに明るみ始める東の空
        body.style.background = "linear-gradient(180deg, #0a0a15 0%, #16213e 30%, #2a3f5f 60%, #1a1a2e 100%)";
    } else if (hours >= 6 && hours < 8) {
        // 朝焼け
        body.style.background = "linear-gradient(180deg, #ff9a9e 0%, #fecfef 30%, #fecfef 60%, #ff9a9e 100%)";
    } else if (hours >= 8 && hours < 10) {
        // 朝
        body.style.background = "linear-gradient(180deg, #a8edea 0%, #fed6e3 30%, #fed6e3 60%, #a8edea 100%)";
    } else if (hours >= 10 && hours < 12) {
        // 午前
        body.style.background = "linear-gradient(180deg, #d299c2 0%, #fef9d7 30%, #fef9d7 60%, #d299c2 100%)";
    } else if (hours >= 12 && hours < 14) {
        // 昼
        body.style.background = "linear-gradient(180deg, #89f7fe 0%, #66a6ff 30%, #66a6ff 60%, #89f7fe 100%)";
    } else if (hours >= 14 && hours < 16) {
        // 午後
        body.style.background = "linear-gradient(180deg, #ffecd2 0%, #fcb69f 30%, #fcb69f 60%, #ffecd2 100%)";
    } else if (hours >= 16 && hours < 18) {
        // 夕焼け
        body.style.background = "linear-gradient(180deg, #ff8a80 0%, #ffb74d 30%, #ffb74d 60%, #ff8a80 100%)";
    } else if (hours >= 18 && hours < 20) {
        // 夕暮れ
        body.style.background = "linear-gradient(180deg, #667eea 0%, #764ba2 30%, #764ba2 60%, #667eea 100%)";
    } else if (hours >= 20 && hours < 22) {
        // 宵の口：夜が深まり始める
        body.style.background = "linear-gradient(180deg, #1a1a2e 0%, #16213e 30%, #0f3460 60%, #0a0a15 100%)";
    } else {
        // 夜：深い夜空
        body.style.background = "linear-gradient(180deg, #000000 0%, #0a0a15 25%, #16213e 50%, #0a0a0a 100%)";
    }
}

// 星空を生成する関数
function generateStars() {
    const starsContainer = document.getElementById('starsContainer');
    const moon = document.getElementById('moon');
    const now = new Date();
    const hours = now.getHours();
    
    // 夜間（18時〜6時）のみ星と月を表示
    if (hours >= 18 || hours < 6) {
        // 月を表示
        moon.style.display = 'block';
        // 既存の星をクリア
        starsContainer.innerHTML = '';
        
        // 星を生成
        const starCount = 200;
        for (let i = 0; i < starCount; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            
            // ランダムなサイズ
            const size = Math.random();
            if (size < 0.5) {
                star.classList.add('small');
            } else if (size < 0.8) {
                star.classList.add('medium');
            } else {
                star.classList.add('large');
            }
            
            // ランダムな位置
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 70 + '%'; // 上部70%に制限
            
            // ランダムなアニメーション遅延
            star.style.animationDelay = Math.random() * 5 + 's';
            
            starsContainer.appendChild(star);
        }
        
        // 流れ星を時々生成
        setInterval(() => {
            if (Math.random() < 0.3) { // 30%の確率
                const shootingStar = document.createElement('div');
                shootingStar.className = 'shooting-star';
                shootingStar.style.left = Math.random() * 100 + '%';
                shootingStar.style.top = Math.random() * 50 + '%';
                starsContainer.appendChild(shootingStar);
                
                // アニメーション終了後に削除
                setTimeout(() => {
                    shootingStar.remove();
                }, 3000);
            }
        }, 5000);
        
        starsContainer.style.display = 'block';
    } else {
        starsContainer.style.display = 'none';
        moon.style.display = 'none';
    }
}

document.addEventListener('DOMContentLoaded', () => {
    updateSkyColor();
    generateStars();
    setInterval(updateSkyColor, 120000);
    setInterval(generateStars, 120000); // 2分ごとに更新
});
</script>
