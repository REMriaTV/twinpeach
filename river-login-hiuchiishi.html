        .container {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }
        
        /* 天候エフェクト */
        .weather-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        
        /* 雨のエフェクト */
        .rain {
            position: absolute;
            width: 2px;
            height: 100px;
            background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.4), transparent);
            animation: fall 1s linear infinite;
        }
        
        @keyframes fall {
            to {
                transform: translateY(100vh);
            }
        }
        
        /* 川の表現 */
        .river {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 30%;
            background: linear-gradient(to bottom, 
                rgba(100, 150, 200, 0.4) 0%,
                rgba(70, 120, 170, 0.6) 50%,
                rgba(50, 100, 150, 0.8) 100%);
            overflow: hidden;
        }
        
        .river-wave {
            position: absolute;
            width: 200%;
            height: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: wave 4s ease-in-out infinite;
        }
        
        @keyframes wave {
            0%, 100% { transform: translateX(0) translateY(0); }
            50% { transform: translateX(-50%) translateY(-5px); }
        }
        
        /* 川岸 */
        .riverbank {
            position: absolute;
            bottom: 30%;
            width: 100%;
            height: 100px;
            background: linear-gradient(to top,
                #8B7355 0%,
                #A0826D 50%,
                #C19A6B 100%);
            clip-path: polygon(0 20%, 100% 0, 100% 100%, 0 100%);
        }
        
        /* 石のエリア */
        .stones-area {
            position: absolute;
            bottom: 32%;
            width: 100%;
            height: 15%;
            z-index: 30; /* より高いz-indexに変更 */
            pointer-events: auto; /* クリック可能にする */
        }
        
        .stone {
            position: absolute;
            cursor: pointer;
            transition: transform 0.3s ease;
            filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.3));
            z-index: 31; /* 石も高いz-indexを設定 */
        }
        
        .stone:hover {
            transform: translateY(-5px) scale(1.1);
        }
        
        /* 石の拡大表示モーダル */
        .stone-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 200;

        .stone-modal-content {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            text-align: center;
            animation: modalFadeIn 0.3s ease;
        }
        
        @keyframes modalFadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        
        .stone-preview {
            width: 200px;
            height: 200px;
            margin: 0 auto 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .stone-preview img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        
        .stone-preview .stone-shape {

            height: 150px;
        }
        
        .modal-buttons {

            gap: 15px;
            justify-content: center;
            margin-top: 20px;

        .modal-button {

            border-radius: 25px;

            cursor: pointer;

        .modal-button.primary {
            background: #4ecdc4;
            color: white;

        .modal-button.primary:hover {
            background: #45b7b8;
        }
        
        .modal-button.secondary {
            background: #e0e0e0;
            color: #333;
        }

            background: #d0d0d0;
        }

            border-radius: 10px;

            margin: 15px 0;

            border-color: #4ecdc4;
        }

            z-index: 20;
            text-align: center;
            padding: 20px;
            margin-bottom: 10%;

            padding: 20px;
            margin: 0 auto 30px;

            color: #333;
            font-size: 1.2em;
        }
        
        .weather-info {
            display: flex;
            justify-content: space-around;
            margin: 15px 0;
        }
        
        .weather-item {
            text-align: center;
        }
        
        .weather-icon {
            font-size: 2em;
            margin-bottom: 5px;
        }
        
        .weather-label {
            font-size: 0.9em;
            color: #666;
        }

            border-radius: 12px;
            padding: 20px 25px;
            max-width: 400px;
            margin: 0 auto;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            min-height: auto;
            position: fixed !important;
            bottom: 50% !important; /* 画面中央付近に配置 */
            left: 50% !important;
            transform: translateX(-50%) !important;
            z-index: 100 !important; /* 確実に最前面に */
        }
        
        .dialogue-text {
            font-size: 1em;
            line-height: 1.5;
            color: #333;
            margin-bottom: 15px;
        }
        
        .dialogue-button {
            background: #4ecdc4;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 20px;
            font-size: 0.95em;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 0 5px;

        .dialogue-button:hover {
            background: #45b7b8;
            transform: scale(1.05);
        }

        .stone-description {
            width: 100%;
            max-width: 400px;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 1em;
            margin: 20px auto;
            display: block;
            min-height: 100px;
            resize: vertical;
        }
        
        .stone-description:focus {
            outline: none;
            border-color: #4ecdc4;
        }
        
        /* 狼煙屋の登場演出 */
        .noroshiya-entrance {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.98);
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            z-index: 100;
            display: none;
            animation: fadeIn 0.5s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translate(-50%, -40%); }
            to { opacity: 1; transform: translate(-50%, -50%); }
        }
        
        .noroshiya-icon-large {
            font-size: 4em;
            margin-bottom: 20px;
        }
        
        .noroshiya-message {
            font-size: 1.2em;
            line-height: 1.8;
            color: #333;
            margin-bottom: 30px;
            font-family: monospace; /* カタカナを強調 */

        /* ローディング */
        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            z-index: 100;
        }
        
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #4ecdc4;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .hidden {
            display: none;
        }
        
        /* 石のモーダル */
        .stone-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 200;
            justify-content: center;
            align-items: center;
        }
        
        .stone-modal-content {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 400px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            text-align: center;
            animation: modalSlideIn 0.3s ease;
        }
        
        @keyframes modalSlideIn {
            from {
                transform: translateY(-20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        
        .stone-preview {
            width: 200px;
            height: 200px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
        }

            display: flex;
            gap: 10px;

        }
        
        .modal-button {
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .modal-button.primary {
            background: #4ecdc4;

        }

            background: #45b7b8;

        }
        
        .modal-button.secondary {
            background: #e0e0e0;
            color: #333;
        }
        
        .modal-button.secondary:hover {
            background: #d0d0d0;
        }
        
        .attraction-input {

            font-size: 16px;
            margin: 10px 0;
        }
        
        .attraction-input:focus {
            outline: none;
            border-color: #4ecdc4;
        }
        
        #modalMessage {
            font-size: 18px;
            margin-bottom: 20px;
            color: #333;
        }
        
        #attractionSection p {
            font-size: 18px;
            margin-bottom: 10px;
            color: #333;
        }
        
        /* スマホ対応 */
        @media (max-width: 768px) {
            .stone-modal-content {
                padding: 20px;
                width: 95%;
            }
            
            .stone-preview {
                width: 150px;
                height: 150px;
            }
            
            .modal-buttons {
                flex-direction: column;
            }
            
            .modal-button {
                width: 100%;
            }
        }
    </style>
</head>
<body>

        <div class="loading-spinner"></div>

                        <button class="modal-button primary" onclick="confirmPick()">決定</button>
                    </div>
                </div>
            </div>
        </div>

        // 石のデータ（データベースから取得）

        // データベースから石データを読み込む
        async function loadStonesFromDatabase() {
            try {
                const { data, error } = await supabase
                    .from('stones')
                    .select('*'); // 全ての石を取得（火打石以外も含む）

                        color: stone.colors?.primary || '#808080',
                        size: stone.size_range || 'medium',

        // 石を生成

        // 火打石の色を抽出する関数
        function extractStoneColors(description) {
            const colorKeywords = {
                '赤い': ['赤い', '赤色', '紅', 'あか'],
                '透明': ['透明', '透き通', 'クリア', 'ガラス'],
                '白い': ['白い', '白色', 'しろ'],
                '黒い': ['黒い', '黒色', 'くろ'],
                '青い': ['青い', '青色', 'あお'],
                '茶色い': ['茶色', '茶', 'ちゃ'],
                'オレンジ': ['オレンジ', '橙'],
                '緑': ['緑', 'みどり'],
                '紫': ['紫', 'むらさき'],
                '黄色い': ['黄色', '黄', 'きいろ']
            };
            
            const foundColors = [];
            const lowerDesc = description.toLowerCase();
            
            for (const [color, keywords] of Object.entries(colorKeywords)) {
                if (keywords.some(keyword => lowerDesc.includes(keyword))) {
                    foundColors.push(color);
                }
            }
            
            return foundColors;
        }

        // 最適な狼煙屋を見つける
        async function findBestMatchNoroshiya(userDescription) {
            try {
                // Supabaseから狼煙屋データを取得
                const { data, error } = await supabase
                    .from('noroshiya_characters')
                    .select('*');
                
                if (error) throw error;
                
                if (!data || data.length === 0) {
                    console.log('狼煙屋データが見つかりません');
                    return getDefaultNoroshiya(userDescription);
                }
                
                // ユーザーの入力から色を抽出
                const userColors = extractStoneColors(userDescription);
                console.log('検出された石の色:', userColors);
                
                // 各狼煙屋とのマッチングスコアを計算
                let bestMatch = null;
                let highestScore = 0;
                
                data.forEach(noroshiya => {
                    let score = 0;
                    
                    // 石の色の好みでマッチング（最重要）
                    if (noroshiya.stone_color_affinities && userColors.length > 0) {
                        userColors.forEach(userColor => {
                            if (noroshiya.stone_color_affinities.includes(userColor)) {
                                score += 50; // 色のマッチは高得点
                            }
                        });
                    }
                    
                    // その他のキーワードでマッチング
                    if (noroshiya.matching_keywords) {
                        const keywords = Array.isArray(noroshiya.matching_keywords) 
                            ? noroshiya.matching_keywords 
                            : noroshiya.matching_keywords.split(/[、,\s]+/);
                            
                        keywords.forEach(keyword => {
                            if (keyword && userDescription.includes(keyword)) {
                                score += 10;
                            }
                        });
                    }
                    
                    console.log(`${noroshiya.color_name}の狼煙屋: スコア ${score}`);
                    
                    if (score > highestScore) {
                        highestScore = score;
                        bestMatch = noroshiya;
                    }
                });
                
                // スコアが0の場合はランダムに選択
                if (highestScore === 0) {
                    console.log('マッチする狼煙屋が見つからないため、ランダムに選択');
                    bestMatch = data[Math.floor(Math.random() * data.length)];
                }
                
                return bestMatch;
                
            } catch (error) {
                console.error('Supabase接続エラー:', error);
                return getDefaultNoroshiya(userDescription);
            }
        }
        
        // マッチングスコアを計算
        function calculateMatchingScore(userDescription, keywords) {
            if (!keywords) return 0;
            
            const userWords = userDescription.toLowerCase().split(/[、,\s]+/);
            const keywordList = keywords.toLowerCase().split(/[、,\s]+/);
            
            let score = 0;
            keywordList.forEach(keyword => {
                if (keyword.trim()) {
                    userWords.forEach(userWord => {
                        if (userWord.includes(keyword.trim()) || keyword.trim().includes(userWord)) {
                            score += 10;
                        }
                    });
                }
            });
            
            return score;
        }
        
        // デフォルトの狼煙屋選択（Supabase接続失敗時）
        function getDefaultNoroshiya(description) {
            const lowerDesc = description.toLowerCase();
            
            if (lowerDesc.includes('黒') || lowerDesc.includes('尖') || lowerDesc.includes('dark')) {
                return { name: 'フクロウジ', type: 'otaku' };
            } else if (lowerDesc.includes('白') || lowerDesc.includes('丸') || lowerDesc.includes('smooth')) {
                return { name: 'ハトポッポ', type: 'calm' };
            } else if (lowerDesc.includes('赤') || lowerDesc.includes('大き') || lowerDesc.includes('big')) {
                return { name: 'ツバクロウ', type: 'speedy' };
            } else if (lowerDesc.includes('ゴツゴツ') || lowerDesc.includes('rough') || lowerDesc.includes('四角')) {
                return { name: 'カラスケ', type: 'mendokusai' };
            }
            
            return { name: 'ピヨマル', type: 'pure' };
        }

        window.addEventListener('load', async () => {
            // 石データを先に読み込む
            await loadStonesFromDatabase();
            
            getWeatherData();
            adjustTimeBasedDisplay();
            generateStones();
            
            // 石を自動的に表示（クリックできる状態にする）
            setTimeout(() => {
                document.querySelectorAll('.stone').forEach((stone, index) => {
                    setTimeout(() => {
                        stone.style.display = 'block';
                    }, index * 50);
                });
            }, 500);
        });
    </script>
</body>
</html>
