        .container {

        /* 天候エフェクト */

            background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.4), transparent);
            animation: fall 1s linear infinite;
        }
        
        @keyframes fall {

                transform: translateY(100vh);
            }
        }
        
        /* 川の表現 */
        .river {
            position: absolute;
            bottom: 0;
            width: 100%;

            border-radius: 50%;
            animation: wave 4s ease-in-out infinite;

        @keyframes wave {

            50% { transform: translateX(-50%) translateY(-5px); }

            top: 50%;
            left: 50%;

        @keyframes fadeIn {
            from { opacity: 0; transform: translate(-50%, -40%); }

        .noroshiya-icon-large {

        .noroshiya-message {

            line-height: 1.8;
            color: #333;

        /* ローディング */
        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;

            text-align: center;

        }
        
        .loading-spinner {
            width: 40px;

            border-top: 4px solid #4ecdc4;
            border-radius: 50%;

            margin: 0 auto 15px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .hidden {
            display: none;
        }
    </style>
</head>

        // 石を生成
        function generateStones() {
            const stonesArea = document.getElementById('stonesArea');
            stonesArea.innerHTML = '';
            
            // ランダムに10-15個の石を配置
            const stoneCount = 10 + Math.floor(Math.random() * 6);
            
            for (let i = 0; i < stoneCount; i++) {
                const stone = document.createElement('div');
                stone.className = 'stone';
                const stoneData = stoneTypes[Math.floor(Math.random() * stoneTypes.length)];
                
                // 石のスタイル設定
                const size = stoneData.size === 'large' ? 40 : stoneData.size === 'medium' ? 25 : 15;
                stone.style.width = size + 'px';
                stone.style.height = size * 0.8 + 'px';
                stone.style.backgroundColor = stoneData.color;
                stone.style.left = Math.random() * 90 + 5 + '%';
                stone.style.top = Math.random() * 80 + 10 + '%';
                stone.style.border = '1px solid rgba(0,0,0,0.3)'; // デバッグ用の境界線
                
                // 形状に応じたスタイル
                if (stoneData.shape === 'round') {
                    stone.style.borderRadius = '50%';
                } else if (stoneData.shape === 'flat') {
                    stone.style.borderRadius = '30%';
                    stone.style.transform = 'scaleY(0.6)';
                } else if (stoneData.shape === 'sharp') {
                    stone.style.clipPath = 'polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%)';
                } else if (stoneData.shape === 'square') {
                    stone.style.borderRadius = '10%';

                stone.dataset.stoneData = JSON.stringify(stoneData);
                stone.style.display = 'block'; // 最初から表示

        // 石拾いを開始

            currentStage = 'pickStone';

        // 石を拾う（テキスト解析）
        async function pickStone() {
            const description = document.querySelector('.stone-description').value;
            if (!description.trim()) {
                alert('石の特徴を入力してください');
                return;
            }
            
            // ローディング表示
            document.getElementById('dialogueText').innerHTML = 'あなたが拾ったのはどうやら火打石のようです...<br><br>狼煙屋を探しています...';
            document.getElementById('dialogueActions').innerHTML = '';
            
            // Supabaseから狼煙屋データを取得してマッチング
            const matchedNoroshiya = await findBestMatchNoroshiya(description);
            
            setTimeout(() => {
                showNoroshiya(matchedNoroshiya);
            }, 2000);
        }
        
        // 最適な狼煙屋を見つける
        async function findBestMatchNoroshiya(userDescription) {
            try {
                // Supabaseから狼煙屋データを取得
                const { data, error } = await supabase
                    .from('noroshiya_characters')
                    .select('id, name, matching_keywords, stone_affinities, dialogues');
                
                if (error) throw error;
                
                if (!data || data.length === 0) {
                    console.log('Supabaseデータが見つからないため、デフォルトロジックを使用');
                    return getDefaultNoroshiya(userDescription);
                }
                
                // 各狼煙屋とのマッチングスコアを計算
                let bestMatch = null;
                let highestScore = 0;
                
                data.forEach(noroshiya => {
                    const score = calculateMatchingScore(userDescription, noroshiya.matching_keywords);
                    console.log(`${noroshiya.name}: スコア ${score}`);
                    
                    if (score > highestScore) {
                        highestScore = score;
                        bestMatch = noroshiya;
                    }
                });
                
                return bestMatch || data[0]; // マッチしない場合は最初のキャラクター
                
            } catch (error) {
                console.error('Supabase接続エラー:', error);
                return getDefaultNoroshiya(userDescription);
            }
        }
        
        // マッチングスコアを計算
        function calculateMatchingScore(userDescription, keywords) {
            if (!keywords) return 0;
            
            const userWords = userDescription.toLowerCase().split(/[、,\s]+/);
            const keywordList = keywords.toLowerCase().split(/[、,\s]+/);
            
            let score = 0;
            keywordList.forEach(keyword => {
                if (keyword.trim()) {
                    userWords.forEach(userWord => {
                        if (userWord.includes(keyword.trim()) || keyword.trim().includes(userWord)) {
                            score += 10;
                        }
                    });
                }
            });
            
            return score;
        }
        
        // デフォルトの狼煙屋選択（Supabase接続失敗時）
        function getDefaultNoroshiya(description) {
            const lowerDesc = description.toLowerCase();
            
            if (lowerDesc.includes('黒') || lowerDesc.includes('尖') || lowerDesc.includes('dark')) {
                return { name: 'フクロウジ', type: 'otaku' };
            } else if (lowerDesc.includes('白') || lowerDesc.includes('丸') || lowerDesc.includes('smooth')) {
                return { name: 'ハトポッポ', type: 'calm' };
            } else if (lowerDesc.includes('赤') || lowerDesc.includes('大き') || lowerDesc.includes('big')) {
                return { name: 'ツバクロウ', type: 'speedy' };
            } else if (lowerDesc.includes('ゴツゴツ') || lowerDesc.includes('rough') || lowerDesc.includes('四角')) {
                return { name: 'カラスケ', type: 'mendokusai' };
            }
            
            return { name: 'ピヨマル', type: 'pure' };
        }

                document.getElementById('noroshiyaMessage').innerHTML = 
                    `「${greeting}」<br><br>` +
                    `${noroshiyaData.name}が現れた！<br><br>` +
                    `「${finalMessage}」`;
                
                // 選択情報を保存
                selectedNoroshiya = noroshiyaData.name;
                localStorage.setItem('selectedNoroshiyaData', JSON.stringify(noroshiyaData));
            } else {
                // デフォルトデータを使用
                const type = noroshiyaData.type || 'pure';
                const noroshiya = noroshiyaTypes[type];
                
                document.getElementById('noroshiyaIcon').textContent = noroshiya.icon;
                document.getElementById('noroshiyaMessage').innerHTML = 
                    `「${noroshiya.greeting}」<br><br>` +
                    `${noroshiya.name}の狼煙屋が現れた！<br><br>` +
                    `「${noroshiya.finalMessage}」`;
                
                selectedNoroshiya = type;
            }
            
            entrance.style.display = 'block';

        // 狼煙屋の挨拶を取得
        function getGreeting(noroshiyaData) {
            const dialogues = noroshiyaData.dialogues;
            if (dialogues && dialogues.hiuchiishi && dialogues.hiuchiishi['初回出会い時']) {
                return dialogues.hiuchiishi['初回出会い時'];
            }
            return getDefaultGreeting(noroshiyaData.name);
        }
        
        // 最終メッセージを取得
        function getFinalMessage(noroshiyaData) {
            const dialogues = noroshiyaData.dialogues;
            if (dialogues && dialogues.hiuchiishi && dialogues.hiuchiishi['再会時']) {
                return dialogues.hiuchiishi['再会時'];
            }
            return getDefaultFinalMessage(noroshiyaData.name);
        }
        
        // アイコンを取得
        function getIcon(name) {
            const icons = {
                'ピヨマル': '🐦',
                'フクロウジ': '🦉',
                'カラスケ': '🐦‍⬛',
                'ハトポッポ': '🕊️',
                'ツバクロウ': '🐦'
            };
            return icons[name] || '🐦';
        }
        
        // デフォルトの挨拶
        function getDefaultGreeting(name) {
            const greetings = {
                'ピヨマル': 'ピヨピヨ！ナニソレ、オモシロソウ！',
                'フクロウジ': 'ホーホー、ダイジョウブカナ？',
                'カラスケ': 'カーカー、ベツニキミノタメジャナイカラネ',
                'ハトポッポ': 'ポッポー、ユックリハナソウヨ',
                'ツバクロウ': 'ピューッ！イソガシイケド、チョットダケ！'
            };
            return greetings[name] || 'ヨロシクネ！';
        }
        
        // デフォルトの最終メッセージ
        function getDefaultFinalMessage(name) {
            const messages = {
                'ピヨマル': 'イッショニ オオゾラヲ トボウ！',
                'フクロウジ': 'キヲツケテ イコウネ',
                'カラスケ': 'マァ、ツイテキテモ イイヨ',
                'ハトポッポ': 'ノンビリ イコウ',
                'ツバクロウ': 'ハヤク イコウ！'
            };
            return messages[name] || 'ヨロシクネ！';
        }
        
        // 出会い完了
        function completeEncounter() {
            if (selectedNoroshiya) {
                // 選択情報を保存
                localStorage.setItem('selectedNoroshiya', selectedNoroshiya);
                localStorage.setItem('noroshiyaData', JSON.stringify(noroshiyaTypes[selectedNoroshiya]));
                localStorage.setItem('userLocation', JSON.stringify({
                    name: weatherData.name,
                    weather: weatherData.weather[0].main,
                    temp: weatherData.main.temp
                }));
                
                // 狼煙場ネットワークへ遷移
                window.location.href = 'field-scroll-final.html';
            }
        }
        
        // 現在地の天候を取得
        async function getWeatherData() {
            try {
                // デモ用データ
                weatherData = {
                    name: '東京',
                    weather: [{ main: 'Rain', description: '小雨' }],
                    main: { temp: 22 }
                };
                updateWeatherDisplay();
                
            } catch (error) {
                console.error('Weather fetch error:', error);
            }
            
            document.getElementById('loading').style.display = 'none';
        }
        
        // 天候表示を更新
        function updateWeatherDisplay() {
            const weatherMain = weatherData.weather[0].main;
            const weatherDesc = weatherData.weather[0].description;
            
            // 背景を変更
            document.body.style.background = weatherBackgrounds[weatherMain] || weatherBackgrounds['Clear'];
            
            // 雨のエフェクトを追加
            if (weatherMain === 'Rain' || weatherMain === 'Drizzle' || weatherMain === 'Thunderstorm') {
                createRainEffect();
            }
            
            // 川の波を生成
            createRiverWaves();
        }
        
        // 雨のエフェクト
        function createRainEffect() {
            const overlay = document.getElementById('weatherOverlay');
            for (let i = 0; i < 100; i++) {
                const rain = document.createElement('div');
                rain.className = 'rain';
                rain.style.left = Math.random() * 100 + '%';
                rain.style.animationDelay = Math.random() * 2 + 's';
                rain.style.animationDuration = (0.5 + Math.random() * 0.5) + 's';
                overlay.appendChild(rain);
            }
        }
        
        // 川の波を生成
        function createRiverWaves() {
            const river = document.getElementById('river');
            for (let i = 0; i < 5; i++) {
                const wave = document.createElement('div');
                wave.className = 'river-wave';
                wave.style.top = (20 + i * 15) + '%';
                wave.style.animationDelay = i * 0.5 + 's';
                river.appendChild(wave);
            }
        }
        
        // 時間帯に応じた表示調整
        function adjustTimeBasedDisplay() {
            const now = new Date();
            
            // 時間帯に応じた空の色調整
            if (now.getHours() >= 18 || now.getHours() < 6) {
                document.body.style.filter = 'brightness(0.7)';
            }
        }
        
        // 初期化
        window.addEventListener('load', () => {
            getWeatherData();
            adjustTimeBasedDisplay();
            generateStones();
        });
    </script>
</body>
</html>
