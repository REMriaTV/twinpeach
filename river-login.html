<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>川の狼煙場 - アクセスポート</title>
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
            min-height: 100vh;
            background: #87CEEB; /* デフォルトの空色 */
            transition: background 3s ease;
        }
        
        .container {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }
        
        /* 天候エフェクト */
        .weather-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        
        /* 雨のエフェクト */
        .rain {
            position: absolute;
            width: 2px;
            height: 100px;
            background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.4), transparent);
            animation: fall 1s linear infinite;
        }
        
        @keyframes fall {
            to {
                transform: translateY(100vh);
            }
        }
        
        /* 川の表現 */
        .river {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 40%;
            background: linear-gradient(to bottom, 
                rgba(100, 150, 200, 0.4) 0%,
                rgba(70, 120, 170, 0.6) 50%,
                rgba(50, 100, 150, 0.8) 100%);
            overflow: hidden;
        }
        
        .river-wave {
            position: absolute;
            width: 200%;
            height: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: wave 4s ease-in-out infinite;
        }
        
        @keyframes wave {
            0%, 100% { transform: translateX(0) translateY(0); }
            50% { transform: translateX(-50%) translateY(-5px); }
        }
        
        /* 川岸 */
        .riverbank {
            position: absolute;
            bottom: 40%;
            width: 100%;
            height: 100px;
            background: linear-gradient(to top,
                #8B7355 0%,
                #A0826D 50%,
                #C19A6B 100%);
            clip-path: polygon(0 20%, 100% 0, 100% 100%, 0 100%);
        }
        
        /* メインコンテンツ */
        .main-content {
            position: relative;
            z-index: 20;
            text-align: center;
            padding: 20px;
            margin-bottom: 10%;
        }
        
        .location-info {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            padding: 20px;
            margin: 0 auto 30px;
            max-width: 400px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .location-info h2 {
            margin: 0 0 10px 0;
            color: #333;
            font-size: 1.2em;
        }
        
        .weather-info {
            display: flex;
            justify-content: space-around;
            margin: 15px 0;
        }
        
        .weather-item {
            text-align: center;
        }
        
        .weather-icon {
            font-size: 2em;
            margin-bottom: 5px;
        }
        
        .weather-label {
            font-size: 0.9em;
            color: #666;
        }
        
        .noroshiya-select {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 30px;
            max-width: 500px;
            margin: 0 auto;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .noroshiya-select h3 {
            margin: 0 0 20px 0;
            color: #333;
        }
        
        .noroshiya-list {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .noroshiya-card {
            width: 80px;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: white;
        }
        
        .noroshiya-card:hover {
            border-color: #4ecdc4;
            transform: translateY(-5px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        
        .noroshiya-card.selected {
            border-color: #ff6b6b;
            background: #fff5f5;
        }
        
        .noroshiya-icon {
            font-size: 2em;
            margin-bottom: 5px;
        }
        
        .noroshiya-name {
            font-size: 0.8em;
            color: #666;
        }
        
        .enter-button {
            background: #4ecdc4;
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 30px;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
        }
        
        .enter-button:hover {
            background: #45b7b8;
            transform: scale(1.05);
        }
        
        .enter-button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        
        /* ローディング */
        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            z-index: 100;
        }
        
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #4ecdc4;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="loading" id="loading">
        <div class="loading-spinner"></div>
        <p>現在地の情報を取得中...</p>
    </div>
    
    <div class="container">
        <!-- 天候オーバーレイ -->
        <div class="weather-overlay" id="weatherOverlay"></div>
        
        <!-- 川 -->
        <div class="river" id="river">
            <!-- 波のアニメーション -->
        </div>
        
        <!-- 川岸 -->
        <div class="riverbank"></div>
        
        <!-- メインコンテンツ -->
        <div class="main-content">
            <div class="location-info">
                <h2>📍 <span id="locationName">現在地</span></h2>
                <div class="weather-info">
                    <div class="weather-item">
                        <div class="weather-icon" id="weatherIcon">☀️</div>
                        <div class="weather-label" id="weatherLabel">晴れ</div>
                    </div>
                    <div class="weather-item">
                        <div class="weather-icon">🌡️</div>
                        <div class="weather-label"><span id="temperature">--</span>°C</div>
                    </div>
                    <div class="weather-item">
                        <div class="weather-icon">🕐</div>
                        <div class="weather-label" id="currentTime">--:--</div>
                    </div>
                </div>
            </div>
            
            <div class="noroshiya-select">
                <h3>あなたの狼煙屋を選んでください</h3>
                <div class="noroshiya-list">
                    <div class="noroshiya-card" data-noroshiya="tsubame">
                        <div class="noroshiya-icon">🕊️</div>
                        <div class="noroshiya-name">燕（つばめ）</div>
                    </div>
                    <div class="noroshiya-card" data-noroshiya="karasu">
                        <div class="noroshiya-icon">🐦‍⬛</div>
                        <div class="noroshiya-name">烏（からす）</div>
                    </div>
                    <div class="noroshiya-card" data-noroshiya="kiji">
                        <div class="noroshiya-icon">🦚</div>
                        <div class="noroshiya-name">雉（きじ）</div>
                    </div>
                    <div class="noroshiya-card" data-noroshiya="fukuro">
                        <div class="noroshiya-icon">🦉</div>
                        <div class="noroshiya-name">梟（ふくろう）</div>
                    </div>
                    <div class="noroshiya-card" data-noroshiya="hato">
                        <div class="noroshiya-icon">🕊️</div>
                        <div class="noroshiya-name">鳩（はと）</div>
                    </div>
                </div>
                <button class="enter-button" id="enterButton" disabled>
                    狼煙場へ入る
                </button>
            </div>
        </div>
    </div>
    
    <script>
        let selectedNoroshiya = null;
        let weatherData = {};
        
        // 天候に応じた背景色
        const weatherBackgrounds = {
            'Clear': 'linear-gradient(180deg, #87CEEB 0%, #98D8E8 100%)',
            'Clouds': 'linear-gradient(180deg, #8B95A1 0%, #B0C4DE 100%)',
            'Rain': 'linear-gradient(180deg, #4A5568 0%, #718096 100%)',
            'Drizzle': 'linear-gradient(180deg, #6B7280 0%, #9CA3AF 100%)',
            'Thunderstorm': 'linear-gradient(180deg, #2D3748 0%, #4A5568 100%)',
            'Snow': 'linear-gradient(180deg, #E0E7FF 0%, #F3F4F6 100%)',
            'Mist': 'linear-gradient(180deg, #CBD5E0 0%, #E2E8F0 100%)',
            'Fog': 'linear-gradient(180deg, #CBD5E0 0%, #E2E8F0 100%)'
        };
        
        // 天候アイコン
        const weatherIcons = {
            'Clear': '☀️',
            'Clouds': '☁️',
            'Rain': '🌧️',
            'Drizzle': '🌦️',
            'Thunderstorm': '⛈️',
            'Snow': '❄️',
            'Mist': '🌫️',
            'Fog': '🌫️'
        };
        
        // 現在地の天候を取得
        async function getWeatherData() {
            try {
                // 位置情報を取得
                const position = await new Promise((resolve, reject) => {
                    navigator.geolocation.getCurrentPosition(resolve, reject);
                });
                
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                
                // OpenWeatherMap API（無料版）を使用
                // 実際の実装では、APIキーをサーバー側で管理すべき
                const apiKey = 'YOUR_API_KEY'; // ここに実際のAPIキーを入れる
                const response = await fetch(`https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&appid=${apiKey}&units=metric&lang=ja`);
                
                if (!response.ok) {
                    throw new Error('Weather API error');
                }
                
                weatherData = await response.json();
                updateWeatherDisplay();
                
            } catch (error) {
                console.error('Weather fetch error:', error);
                // デモ用のフォールバックデータ
                weatherData = {
                    name: '東京',
                    weather: [{ main: 'Rain', description: '小雨' }],
                    main: { temp: 22 }
                };
                updateWeatherDisplay();
            }
            
            document.getElementById('loading').style.display = 'none';
        }
        
        // 天候表示を更新
        function updateWeatherDisplay() {
            const weatherMain = weatherData.weather[0].main;
            const weatherDesc = weatherData.weather[0].description;
            
            // 背景を変更
            document.body.style.background = weatherBackgrounds[weatherMain] || weatherBackgrounds['Clear'];
            
            // 天候情報を更新
            document.getElementById('locationName').textContent = weatherData.name || '現在地';
            document.getElementById('weatherIcon').textContent = weatherIcons[weatherMain] || '🌤️';
            document.getElementById('weatherLabel').textContent = weatherDesc;
            document.getElementById('temperature').textContent = Math.round(weatherData.main.temp);
            
            // 雨のエフェクトを追加
            if (weatherMain === 'Rain' || weatherMain === 'Drizzle' || weatherMain === 'Thunderstorm') {
                createRainEffect();
            }
            
            // 川の波を生成
            createRiverWaves();
        }
        
        // 雨のエフェクト
        function createRainEffect() {
            const overlay = document.getElementById('weatherOverlay');
            for (let i = 0; i < 100; i++) {
                const rain = document.createElement('div');
                rain.className = 'rain';
                rain.style.left = Math.random() * 100 + '%';
                rain.style.animationDelay = Math.random() * 2 + 's';
                rain.style.animationDuration = (0.5 + Math.random() * 0.5) + 's';
                overlay.appendChild(rain);
            }
        }
        
        // 川の波を生成
        function createRiverWaves() {
            const river = document.getElementById('river');
            for (let i = 0; i < 5; i++) {
                const wave = document.createElement('div');
                wave.className = 'river-wave';
                wave.style.top = (20 + i * 15) + '%';
                wave.style.animationDelay = i * 0.5 + 's';
                river.appendChild(wave);
            }
        }
        
        // 現在時刻を更新
        function updateTime() {
            const now = new Date();
            const hours = now.getHours().toString().padStart(2, '0');
            const minutes = now.getMinutes().toString().padStart(2, '0');
            document.getElementById('currentTime').textContent = `${hours}:${minutes}`;
            
            // 時間帯に応じた空の色調整
            if (now.getHours() >= 18 || now.getHours() < 6) {
                document.body.style.filter = 'brightness(0.7)';
            }
        }
        
        // 狼煙屋選択
        document.querySelectorAll('.noroshiya-card').forEach(card => {
            card.addEventListener('click', () => {
                // 選択状態をクリア
                document.querySelectorAll('.noroshiya-card').forEach(c => {
                    c.classList.remove('selected');
                });
                
                // 新しい選択
                card.classList.add('selected');
                selectedNoroshiya = card.dataset.noroshiya;
                document.getElementById('enterButton').disabled = false;
            });
        });
        
        // 入場ボタン
        document.getElementById('enterButton').addEventListener('click', () => {
            if (selectedNoroshiya) {
                // 選択情報を保存
                localStorage.setItem('selectedNoroshiya', selectedNoroshiya);
                localStorage.setItem('userLocation', JSON.stringify({
                    name: weatherData.name,
                    weather: weatherData.weather[0].main,
                    temp: weatherData.main.temp
                }));
                
                // 狼煙場ネットワークへ遷移
                window.location.href = 'field-scroll-final.html';
            }
        });
        
        // 初期化
        window.addEventListener('load', () => {
            getWeatherData();
            updateTime();
            setInterval(updateTime, 60000); // 1分ごとに更新
        });
    </script>
</body>
</html>
