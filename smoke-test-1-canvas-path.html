<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>煙テスト1: Canvasパス描画</title>
    <style>
        body {
            margin: 0;
            background: linear-gradient(180deg, #89f7fe 0%, #66a6ff 50%, #89f7fe 100%);
            overflow: hidden;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="smokeCanvas"></canvas>
    
    <script>
        const canvas = document.getElementById('smokeCanvas');
        const ctx = canvas.getContext('2d');
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        // 煙源
        const smokeSources = [];
        for (let i = 0; i < 5; i++) {
            smokeSources.push({
                x: Math.random() * canvas.width,
                y: canvas.height * 0.7,
                phase: Math.random() * Math.PI * 2
            });
        }
        
        function drawSmoke(time) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            smokeSources.forEach((source, i) => {
                ctx.save();
                ctx.translate(source.x, source.y);
                
                // 煙の柱を曲線で描画
                ctx.beginPath();
                ctx.moveTo(0, 0);
                
                const segments = 50;
                for (let j = 0; j <= segments; j++) {
                    const progress = j / segments;
                    const y = -progress * 400; // 高さ
                    
                    // 風による揺れ
                    const windOffset = Math.sin(time * 0.001 + progress * 3 + source.phase) * 20 * progress;
                    const x = windOffset;
                    
                    // 幅（上に行くほど広がる）
                    const width = 2 + progress * 8;
                    
                    if (j === 0) {
                        ctx.moveTo(x - width/2, y);
                    } else {
                        ctx.lineTo(x - width/2, y);
                    }
                }
                
                // 右側を描く
                for (let j = segments; j >= 0; j--) {
                    const progress = j / segments;
                    const y = -progress * 400;
                    const windOffset = Math.sin(time * 0.001 + progress * 3 + source.phase) * 20 * progress;
                    const x = windOffset;
                    const width = 2 + progress * 8;
                    ctx.lineTo(x + width/2, y);
                }
                
                ctx.closePath();
                
                // グラデーション
                const gradient = ctx.createLinearGradient(0, 0, 0, -400);
                gradient.addColorStop(0, 'rgba(255, 255, 255, 0.9)');
                gradient.addColorStop(0.5, 'rgba(255, 255, 255, 0.6)');
                gradient.addColorStop(1, 'rgba(255, 255, 255, 0.1)');
                
                ctx.fillStyle = gradient;
                ctx.fill();
                
                ctx.restore();
            });
            
            requestAnimationFrame(() => drawSmoke(time + 16));
        }
        
        drawSmoke(0);
    </script>
</body>
</html>
