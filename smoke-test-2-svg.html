<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>煙テスト2: SVGアニメーション</title>
    <style>
        body {
            margin: 0;
            background: linear-gradient(180deg, #89f7fe 0%, #66a6ff 50%, #89f7fe 100%);
            overflow: hidden;
        }
        .smoke-container {
            position: absolute;
            bottom: 30%;
            width: 100%;
            height: 70%;
        }
        .smoke-column {
            position: absolute;
            bottom: 0;
            width: 100px;
            height: 100%;
        }
        @keyframes sway {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(20px); }
        }
        @keyframes rise {
            from {
                transform: translateY(0) scaleY(0);
                opacity: 0.9;
            }
            to {
                transform: translateY(-100%) scaleY(1);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="smoke-container">
        <!-- 煙の柱を動的に生成 -->
    </div>
    
    <script>
        const container = document.querySelector('.smoke-container');
        
        // 5つの煙源を作成
        for (let i = 0; i < 5; i++) {
            const smokeColumn = document.createElement('div');
            smokeColumn.className = 'smoke-column';
            smokeColumn.style.left = Math.random() * window.innerWidth + 'px';
            
            const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svg.setAttribute('width', '100');
            svg.setAttribute('height', '400');
            svg.style.width = '100%';
            svg.style.height = '100%';
            
            // パスを使った煙
            const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            const d = generateSmokePath();
            path.setAttribute('d', d);
            path.setAttribute('fill', 'url(#smokeGradient' + i + ')');
            path.style.animation = `sway ${3 + Math.random() * 2}s ease-in-out infinite`;
            
            // グラデーション定義
            const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
            const gradient = document.createElementNS('http://www.w3.org/2000/svg', 'linearGradient');
            gradient.setAttribute('id', 'smokeGradient' + i);
            gradient.setAttribute('x1', '0%');
            gradient.setAttribute('y1', '100%');
            gradient.setAttribute('x2', '0%');
            gradient.setAttribute('y2', '0%');
            
            const stop1 = document.createElementNS('http://www.w3.org/2000/svg', 'stop');
            stop1.setAttribute('offset', '0%');
            stop1.setAttribute('style', 'stop-color:white;stop-opacity:0.9');
            
            const stop2 = document.createElementNS('http://www.w3.org/2000/svg', 'stop');
            stop2.setAttribute('offset', '50%');
            stop2.setAttribute('style', 'stop-color:white;stop-opacity:0.6');
            
            const stop3 = document.createElementNS('http://www.w3.org/2000/svg', 'stop');
            stop3.setAttribute('offset', '100%');
            stop3.setAttribute('style', 'stop-color:white;stop-opacity:0.1');
            
            gradient.appendChild(stop1);
            gradient.appendChild(stop2);
            gradient.appendChild(stop3);
            defs.appendChild(gradient);
            
            svg.appendChild(defs);
            svg.appendChild(path);
            smokeColumn.appendChild(svg);
            container.appendChild(smokeColumn);
            
            // アニメーション
            animateSmoke(path);
        }
        
        function generateSmokePath() {
            // ベジェ曲線で煙の形を生成
            const points = [];
            const steps = 10;
            
            for (let i = 0; i <= steps; i++) {
                const progress = i / steps;
                const width = 2 + progress * 15; // 上に行くほど広がる
                const x = 50; // 中心
                const y = 400 - (progress * 400);
                
                if (i === 0) {
                    points.push(`M ${x - width/2} ${y}`);
                } else {
                    const cp1x = x - width/2 + Math.random() * 10 - 5;
                    const cp1y = y + 20;
                    const cp2x = x - width/2 + Math.random() * 10 - 5;
                    const cp2y = y - 20;
                    points.push(`C ${cp1x} ${cp1y}, ${cp2x} ${cp2y}, ${x - width/2} ${y}`);
                }
            }
            
            // 右側
            for (let i = steps; i >= 0; i--) {
                const progress = i / steps;
                const width = 2 + progress * 15;
                const x = 50;
                const y = 400 - (progress * 400);
                
                const cp1x = x + width/2 + Math.random() * 10 - 5;
                const cp1y = y - 20;
                const cp2x = x + width/2 + Math.random() * 10 - 5;
                const cp2y = y + 20;
                points.push(`C ${cp1x} ${cp1y}, ${cp2x} ${cp2y}, ${x + width/2} ${y}`);
            }
            
            points.push('Z');
            return points.join(' ');
        }
        
        function animateSmoke(path) {
            setInterval(() => {
                const d = generateSmokePath();
                path.setAttribute('d', d);
            }, 2000);
        }
    </script>
</body>
</html>
