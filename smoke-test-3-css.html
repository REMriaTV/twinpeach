<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>煙テスト3: CSSグラデーションアニメーション</title>
    <style>
        body {
            margin: 0;
            background: linear-gradient(180deg, #89f7fe 0%, #66a6ff 50%, #89f7fe 100%);
            overflow: hidden;
            height: 100vh;
        }
        
        .smoke-source {
            position: absolute;
            bottom: 30%;
            width: 20px;
            height: 400px;
        }
        
        .smoke-column {
            width: 100%;
            height: 100%;
            background: linear-gradient(to top,
                rgba(255,255,255,0.9) 0%,
                rgba(255,255,255,0.8) 10%,
                rgba(255,255,255,0.6) 30%,
                rgba(255,255,255,0.4) 50%,
                rgba(255,255,255,0.2) 70%,
                rgba(255,255,255,0) 100%
            );
            clip-path: polygon(
                45% 100%, 40% 95%, 35% 90%, 30% 80%, 25% 70%,
                20% 60%, 15% 50%, 10% 40%, 5% 30%, 0% 20%,
                0% 10%, 5% 0%,
                95% 0%, 100% 10%, 100% 20%, 95% 30%, 90% 40%,
                85% 50%, 80% 60%, 75% 70%, 70% 80%, 65% 90%,
                60% 95%, 55% 100%
            );
            animation: smokeWave 4s ease-in-out infinite;
            transform-origin: bottom center;
        }
        
        @keyframes smokeWave {
            0%, 100% {
                transform: scaleY(1) translateX(0);
                filter: blur(2px);
            }
            25% {
                transform: scaleY(1.1) translateX(5px);
                filter: blur(3px);
            }
            50% {
                transform: scaleY(1) translateX(-5px);
                filter: blur(2px);
            }
            75% {
                transform: scaleY(0.9) translateX(3px);
                filter: blur(1px);
            }
        }
        
        .smoke-column::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(to top,
                rgba(255,255,255,0.7) 0%,
                rgba(255,255,255,0.5) 20%,
                rgba(255,255,255,0.3) 40%,
                rgba(255,255,255,0.1) 60%,
                rgba(255,255,255,0) 80%
            );
            animation: smokePulse 3s ease-in-out infinite;
            animation-delay: 0.5s;
        }
        
        @keyframes smokePulse {
            0%, 100% {
                opacity: 0.8;
                transform: scale(1);
            }
            50% {
                opacity: 1;
                transform: scale(1.1);
            }
        }
    </style>
</head>
<body>
    <script>
        // 5つの煙源を生成
        for (let i = 0; i < 5; i++) {
            const smoke = document.createElement('div');
            smoke.className = 'smoke-source';
            smoke.style.left = Math.random() * window.innerWidth + 'px';
            
            const column = document.createElement('div');
            column.className = 'smoke-column';
            column.style.animationDelay = Math.random() * 2 + 's';
            column.style.animationDuration = (3 + Math.random() * 2) + 's';
            
            smoke.appendChild(column);
            document.body.appendChild(smoke);
        }
    </script>
</body>
</html>
