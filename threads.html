<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>狼煙選択 - Smoke Network Service</title>
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(to bottom, #0a0a0a 0%, #1a1a1a 100%);
            color: #fff;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            box-sizing: border-box;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        
        h1 {
            text-align: center;
            color: #ff6b6b;
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(255, 107, 107, 0.5);
        }
        
        h2 {
            text-align: center;
            color: #999;
            font-size: 1.3em;
            margin-bottom: 30px;
        }
        
        .intro {
            text-align: center;
            font-size: 1.1em;
            color: #ccc;
            margin-bottom: 40px;
            line-height: 1.8;
        }
        
        .back-link {
            display: inline-block;
            margin-bottom: 30px;
            color: #ff6b6b;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s ease;
        }
        
        .back-link:hover {
            color: #ff5252;
        }
        
        .threads-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .thread-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .thread-card:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 107, 107, 0.3);
            transform: translateX(5px);
        }
        
        .thread-info {
            flex: 1;
        }
        
        .thread-title {
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 8px;
            color: #4ecdc4;
        }
        
        .thread-meta {
            font-size: 0.9em;
            color: #999;
        }
        
        .thread-status {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 5px;
        }
        
        .message-count {
            font-size: 0.9em;
            color: #666;
        }
        
        .last-update {
            font-size: 0.8em;
            color: #666;
        }
        
        .new-thread-btn {
            width: 100%;
            padding: 20px;
            background: rgba(255, 107, 107, 0.1);
            border: 2px dashed rgba(255, 107, 107, 0.3);
            border-radius: 10px;
            color: #ff6b6b;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }
        
        .new-thread-btn:hover {
            background: rgba(255, 107, 107, 0.2);
            border-color: rgba(255, 107, 107, 0.5);
            transform: translateY(-2px);
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }
        
        .empty-state p {
            margin-bottom: 30px;
            font-size: 1.1em;
        }
        
        /* 煙のアニメーション */
        .smoke-icon {
            display: inline-block;
            animation: float 3s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="field.html" class="back-link">← 狼煙場一覧へ戻る</a>
        
        <h1>狼煙選択</h1>
        <h2 id="placeName"></h2>
        
        <div class="intro">
            この場所に上がっている狼煙を選ぶか、<br>
            新しく狼煙を焚いてください
        </div>
        
        <div id="threadsList" class="threads-list">
            <!-- スレッドリストがここに動的に挿入される -->
        </div>
        
        <button class="new-thread-btn" onclick="createNewThread()">
            <span class="smoke-icon">🔥</span> 新しく狼煙を焚く
        </button>
    </div>
    
    <script>
        // URLパラメータから場所を取得
        const urlParams = new URLSearchParams(window.location.search);
        const currentPlace = urlParams.get('place') || 'default';
        
        // 場所名のマッピング
        const placeNames = {
            'ibuki': '伊吹山麓',
            'biwa': '琵琶湖畔',
            'kusatsu': '草津街道',
            'keihoku': '京北山中',
            'tango': '丹後岬',
            'default': '狼煙場'
        };
        
        // スレッド情報の管理（ローカルストレージ）
        const threadsKey = `twinpeach-threads-${currentPlace}`;
        let threads = JSON.parse(localStorage.getItem(threadsKey) || '[]');
        
        // ページ読み込み時の処理
        window.addEventListener('load', () => {
            // 場所名を表示
            document.getElementById('placeName').textContent = `${placeNames[currentPlace]}の狼煙場`;
            
            // スレッドリストを表示
            displayThreads();
        });
        
        // スレッド一覧を表示
        function displayThreads() {
            const threadsList = document.getElementById('threadsList');
            
            if (threads.length === 0) {
                threadsList.innerHTML = `
                    <div class="empty-state">
                        <p>まだ狼煙が上がっていません</p>
                    </div>
                `;
                return;
            }
            
            threadsList.innerHTML = '';
            
            // スレッドを新しい順に表示
            threads.sort((a, b) => b.lastUpdate - a.lastUpdate).forEach(thread => {
                const threadCard = createThreadCard(thread);
                threadsList.appendChild(threadCard);
            });
        }
        
        // スレッドカードを作成
        function createThreadCard(thread) {
            const card = document.createElement('div');
            card.className = 'thread-card';
            card.onclick = () => enterThread(thread.id);
            
            // メッセージ数を取得
            const messagesKey = `twinpeach-messages-${currentPlace}-${thread.id}`;
            const messages = JSON.parse(localStorage.getItem(messagesKey) || '[]');
            const messageCount = messages.length;
            
            // 最終更新日時
            const lastUpdate = thread.lastUpdate ? new Date(thread.lastUpdate).toLocaleDateString('ja-JP') : '不明';
            
            card.innerHTML = `
                <div class="thread-info">
                    <div class="thread-title">${thread.title || '狼煙 #' + thread.id}</div>
                    <div class="thread-meta">${thread.description || '説明なし'}</div>
                </div>
                <div class="thread-status">
                    <div class="message-count">${messageCount} メッセージ</div>
                    <div class="last-update">${lastUpdate}</div>
                </div>
            `;
            
            return card;
        }
        
        // スレッドに入る
        function enterThread(threadId) {
            window.location.href = `noroshi.html?place=${currentPlace}&thread=${threadId}`;
        }
        
        // 新しいスレッドを作成
        function createNewThread() {
            const title = prompt('狼煙の名前を入力してください（空欄でもOK）:');
            const description = prompt('どんな話をする狼煙ですか？（空欄でもOK）:');
            
            // キャンセルした場合は何もしない
            if (title === null && description === null) return;
            
            // 新しいスレッドIDを生成
            const newThreadId = Date.now().toString();
            
            // スレッド情報を保存
            const newThread = {
                id: newThreadId,
                title: title || '',
                description: description || '',
                createdAt: Date.now(),
                lastUpdate: Date.now()
            };
            
            threads.push(newThread);
            localStorage.setItem(threadsKey, JSON.stringify(threads));
            
            // 新しいスレッドに移動
            enterThread(newThreadId);
        }
    </script>
</body>
</html>
